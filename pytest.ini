[pytest]
# The tests import the app as a package (`from backend.settings import ...`),
# so the repo root has to be on sys.path. Only `python -m pytest` adds the cwd
# implicitly, which made the documented bare `pytest` fail collection with
# "No module named 'backend'". Pinning it here fixes the invocation for good:
# this file also fixes rootdir, so `pythonpath` resolves to the repo root no
# matter which directory pytest is launched from.
pythonpath = .
testpaths = backend/tests
